{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                <h4 class="fw-bold"><i class="bi bi-pencil-square text-primary me-2"></i>Create a Post</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('community.create_post') }}" method="POST" enctype="multipart/form-data">
                    
                    {% if scan %}
                    <div class="alert alert-info border-0 rounded-3 mb-4 d-flex align-items-center">
                        <i class="bi bi-upc-scan fs-4 me-3 text-info"></i>
                        <div>
                            <h6 class="fw-bold mb-1">Attaching Scan to Post</h6>
                            <p class="mb-0 small">You are attaching the scan for <strong>{{ scan['product_name'] }}</strong> ({{ scan['status'] }}).</p>
                            <input type="hidden" name="scan_id" value="{{ scan['id'] }}">
                        </div>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" class="form-control rounded-3" name="title" required placeholder="What's on your mind?">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Category Tag</label>
                        <select class="form-select rounded-3" name="category">
                            <option value="Discussion">Discussion</option>
                            <option value="Counterfeit Alert">Counterfeit Alert</option>
                            <option value="Health Warning">Health Warning</option>
                            <option value="Healthy Eats">Healthy Eats</option>
                            <option value="Question">Question</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Content</label>
                        <textarea class="form-control rounded-3" name="content" rows="6" required placeholder="Share the details..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Attach Image (Optional)</label>
                        <input class="form-control rounded-3" type="file" name="image" accept="image/*">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('community.feed') }}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Post to Community</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
